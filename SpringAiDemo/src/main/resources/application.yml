spring:
  application:
    name: spring-ai-chat

  ai:
    google:
      genai:
        api-key: ${GEMINI_API_KEY}
        chat:
          options:
            model: gemini-3.5-flash

  datasource:
    url: ${MYSQL_URL:jdbc:mysql://localhost:3306/spring_ai_chat}
    username: ${MYSQL_USERNAME:root}
    password: ${MYSQL_PASSWORD:Csh22023@}

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  data:
    mongodb:
      uri: ${MONGODB_URI}

server:
  port: ${PORT:8080}

jwt:
  secret: ${JWT_SECRET}
  expiration: ${JWT_EXPIRATION}